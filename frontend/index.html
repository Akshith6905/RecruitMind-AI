<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f5f6f8"/><title>RecruitMind — memory-led hiring</title>
<style>html,body,#root{min-height:100%;margin:0}body{background:#f5f6f8;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252b36}.boot{max-width:520px;margin:15vh auto;padding:28px;background:#fff;border:1px solid #e9ebef;border-radius:12px;box-shadow:0 8px 30px #1822380d}.boot h1{font-size:20px;margin:0 0 8px}.boot p{color:#707887;line-height:1.55}.boot code{font-size:12px}</style>
<script>window.addEventListener('error',function(e){var n=document.getElementById('boot-error');if(n){n.hidden=false;n.textContent='Frontend failed to start: '+(e.message||'module load error')+(e.filename?' ('+e.filename+':'+e.lineno+')':'')}});window.addEventListener('unhandledrejection',function(e){var n=document.getElementById('boot-error');if(n){n.hidden=false;n.textContent='Frontend request failed: '+String(e.reason)}});</script></head><body><div id="root"><div class="boot"><h1>RecruitMind is starting…</h1><p>If this message stays here, the application script did not finish loading.</p><p id="boot-error" hidden></p><p><code>http://127.0.0.1:5173</code></p></div></div><script type="module" src="/src/main.jsx"></script></body></html>
